# prj.conf — zephyr-edge-platform firmware (native_sim)
#
# Subsystem enablement for Phase 1: custom BME280 I2C sensor driver, I2C
# emulator (native_sim), ring-buffered sensor logging, low-power scheduler,
# and logging.
#
# Power management note: CONFIG_PM depends on HAS_PM, which native_sim does not
# select, so the Zephyr PM policy calls in power_sched.c compile out on
# native_sim (guarded by `#if defined(CONFIG_PM)`). The scheduler still cycles
# ACTIVE -> IDLE -> SLEEP and tracks per-state time in software; on a real PM
# capable target (e.g. nRF52840) a board conf enables CONFIG_PM and the policy
# locks take effect. This matches the plan's documented limitation that
# native_sim measures power-state time distribution, not real milliwatts.

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Sensor subsystem + custom BME280 driver ---
CONFIG_SENSOR=y
CONFIG_BME280_CUSTOM=y

# --- I2C bus + native_sim I2C emulator ---
CONFIG_I2C=y
CONFIG_I2C_EMUL=y
CONFIG_EMUL=y
CONFIG_BME280_CUSTOM_EMUL=y

# --- Ring buffer (sensor_log) ---
CONFIG_RING_BUFFER=y

# --- Console so `just run` shows the app loop on stdout (native_sim) ---
CONFIG_CONSOLE=y

# --- Phase 2: MQTT telemetry (CBOR-encoded) ---
# CBOR encoder library (zcbor; CONFIG_ZCBOR) for the telemetry payload
# (docs/DATA_MODEL.md).
CONFIG_ZCBOR=y

# Zephyr MQTT client library (selects NET_SOCKETS).
CONFIG_MQTT_LIB=y

# Native networking stack for native_sim (telemetry.c uses the native
# zsock_* socket API). The board defaults to the TAP ethernet driver
# (CONFIG_ETH_NATIVE_POSIX) when NETWORKING is enabled, so live publication to
# a host broker requires the host-side bridge (see infra/README.md and the
# plan's documented limitation).
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=n

# Static IPv4 config: device 192.0.2.1, host/gateway 192.0.2.2 (the standard
# Zephyr native net-setup topology; the broker is reached at the gateway).
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"

# Random/entropy for the network stack on native_sim.
CONFIG_TEST_RANDOM_GENERATOR=y

# Networking + MQTT need a larger main stack than the Phase 1 sensor loop.
CONFIG_MAIN_STACK_SIZE=4096
