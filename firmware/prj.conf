# prj.conf — zephyr-edge-platform firmware (native_sim)
#
# Subsystem enablement for Phase 1: custom BME280 I2C sensor driver, I2C
# emulator (native_sim), ring-buffered sensor logging, low-power scheduler,
# and logging.
#
# Power management note: CONFIG_PM depends on HAS_PM, which native_sim does not
# select, so the Zephyr PM policy calls in power_sched.c compile out on
# native_sim (guarded by `#if defined(CONFIG_PM)`). The scheduler still cycles
# ACTIVE -> IDLE -> SLEEP and tracks per-state time in software. The current
# nRF52840 Zephyr config does not select HAS_PM either, so the numbers remain a
# software time distribution; real current measurement needs a PPK2.

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Sensor subsystem + custom BME280 driver ---
CONFIG_SENSOR=y
CONFIG_BME280_CUSTOM=y

# --- I2C bus + native_sim I2C emulator ---
CONFIG_I2C=y
CONFIG_I2C_EMUL=y
CONFIG_EMUL=y
CONFIG_BME280_CUSTOM_EMUL=y

# --- Ring buffer (sensor_log) ---
CONFIG_RING_BUFFER=y

# --- Console so `just run` shows the app loop on stdout (native_sim) ---
CONFIG_CONSOLE=y

# --- Phase 2: MQTT telemetry (CBOR-encoded) ---
# CBOR encoder library (zcbor; CONFIG_ZCBOR) for the telemetry payload
# (docs/DATA_MODEL.md).
CONFIG_ZCBOR=y

# Zephyr MQTT client library (selects NET_SOCKETS) + TLS.
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=30000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
# TLS 1.2 ECDHE-RSA (the Mosquitto default cipher set is not RSA-only).
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y

# Native networking stack for native_sim (telemetry.c uses the native
# zsock_* socket API). The board defaults to the TAP ethernet driver
# (CONFIG_ETH_NATIVE_POSIX) when NETWORKING is enabled, so live publication to
# a host broker requires the host-side bridge (see infra/README.md and the
# plan's documented limitation).
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=n

# Static IPv4 config: device 192.0.2.1, host/gateway 192.0.2.2 (the standard
# Zephyr native net-setup topology; the broker is reached at the gateway).
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"

# Random/entropy for the network stack on native_sim.
CONFIG_TEST_RANDOM_GENERATOR=y

# Networking + MQTT + OTA need a larger main stack than the sensor loop,
# especially on 64-bit targets.
CONFIG_MAIN_STACK_SIZE=16384

# --- Phase 3: MCUboot OTA (native_sim simulation) ---
# Flash simulator for OTA image staging on native_sim.
CONFIG_FLASH_SIMULATOR=y

# MCUboot image manager (img_manager) for image validation and swap control.
# Note: CONFIG_BOOTLOADER_MCUBOOT is NOT enabled on native_sim because it
# requires HAS_FLASH_LOAD_OFFSET which native_sim does not provide. The OTA
# module uses the img_manager API directly for simulation purposes.
CONFIG_IMG_MANAGER=y
CONFIG_IMG_BLOCK_BUF_SIZE=512
# Erase slot1 pages as chunks arrive (required for NOR flash and the simulator).
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Stream flash for chunked OTA image writes.
CONFIG_STREAM_FLASH=y

# Flash subsystem (required by IMG_MANAGER and STREAM_FLASH).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --- Phase 3: Fault injection (Kconfig-gated) ---
# The framework is compiled out of the production app by default. The
# fault_inject ztest suite enables the framework and all fault modes.
CONFIG_FAULT_INJECT=n
