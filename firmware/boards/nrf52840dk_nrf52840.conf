# nRF52840 DK hardware build.
#
# Disable native_sim-only emulators/simulators. The default sysbuild path adds
# MCUboot; see firmware/sysbuild.conf and tests/hil/README.md.
#
# CONFIG_PM is left to the SoC; power_sched's PM guards compile out when the
# target does not select HAS_PM (as with this Zephyr nRF52840 config).

CONFIG_PM_DEVICE=y

CONFIG_I2C_EMUL=n
CONFIG_EMUL=n
CONFIG_BME280_CUSTOM_EMUL=n
CONFIG_FLASH_SIMULATOR=n
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_NET_NATIVE=n
