# power_bench.conf — short power-scheduler windows for the host benchmark.
#
# tests/scripts/power_bench.sh runs the native_sim binary for a few seconds and
# parses the cumulative "power:" log lines. The default 10s cycle would produce
# no samples in that window, so `just power-bench` builds with this overlay.
CONFIG_POWER_ACTIVE_MS=500
CONFIG_POWER_IDLE_MS=100
CONFIG_POWER_SLEEP_MS=500
