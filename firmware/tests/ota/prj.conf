# prj.conf — OTA ztest suite (native_sim)
CONFIG_ZTEST=y
CONFIG_LOG=y

# Flash simulator + MCUboot image management for OTA testing.
# Note: CONFIG_BOOTLOADER_MCUBOOT is NOT enabled on native_sim because it
# requires HAS_FLASH_LOAD_OFFSET which native_sim does not provide.
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# Networking (required by ota_update.c for MQTT types).
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_MQTT_LIB=y

# Larger stack for flash operations.
CONFIG_MAIN_STACK_SIZE=4096
