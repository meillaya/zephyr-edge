# Local observability stack for the Zephyr edge platform.
# Services: Mosquitto (MQTT broker) → cloud-ingest (Go) → Prometheus → Grafana
name: zephyr-edge-platform

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - ./tls:/mosquitto/certs:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt -u edge-device -P change-me -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloud-ingest:
    build:
      context: ../cloud
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER: tls://mosquitto:8883
      MQTT_TLS_CA: /certs/ca.crt
      MQTT_TLS_SERVER_NAME: mosquitto
      MQTT_USERNAME: edge-ingest
      MQTT_PASSWORD: change-me
      MQTT_TOPIC: "telemetry/+"
      HTTP_ADDR: ":9090"
      CLIENT_ID: cloud-ingest
    volumes:
      - ./tls:/certs:ro
    ports:
      - "9090:9090"
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.4.0
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      cloud-ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
